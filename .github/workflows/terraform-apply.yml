# Terraform Apply (TriAIge)
#
# Disparo manual (workflow_dispatch) que provisiona/atualiza a infra do
# Terraform em terraform/ deste repositório.
#
# Pré-requisitos (Secrets do repositório, em Settings > Secrets and
# variables > Actions):
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - AWS_SESSION_TOKEN
#
# Esses três valores vêm da aba "AWS Details" > "AWS CLI" do AWS Academy
# Learner Lab e MUDAM a cada vez que o laboratório é (re)iniciado. Antes de
# disparar este workflow, copie os três valores atuais do laboratório para
# os Secrets acima (sobrescrevendo os anteriores).
#
# Estrutura de jobs:
#   1. apply               - terraform apply e publica os outputs (tfout.json)
#                             como artifact para o job seguinte.
#   2. configure-mysql      - (Ansible) instala/configura o MySQL na
#                             ec2-private-banco-dados (banco único "triaige",
#                             usuário triaige, schema + seed de conveniência),
#                             via ProxyJump por uma das EC2 públicas.
# O job 2 depende apenas do job 1.
#
# O deploy dos serviços de app (triaige-srv-mcp-ai, triaige-srv-orchestrator,
# triaige-srv-notification) NÃO roda mais aqui — foi desacoplado pro workflow
# "Deploy Apps" (deploy-apps.yml), disparado sob demanda (workflow_dispatch)
# igual este, mas sem precisar reprovisionar infra. Depois de um apply que
# recria as EC2 públicas (ex: troca de AMI), rode "Deploy Apps" em seguida
# pra subir os containers.
#
# Secrets adicionais usados pelo job de Ansible:
#   - EC2_PUBLIC_SSH_KEY: conteúdo do arquivo
#     terraform/keys/key-ec2-public-triaige.pem (chave SSH das EC2 públicas,
#     usuário "ubuntu"). Esse arquivo é gitignored, copie o conteúdo local.
#     Usado como jump host (proxy) para alcançar a EC2 privada.
#   - EC2_PRIVATE_SSH_KEY: conteúdo do arquivo
#     terraform/keys/key-ec2-private-triaige.pem (chave SSH da
#     ec2-private-banco-dados, usuário "ubuntu"). Também gitignored.
#   - PROD_DB_USERNAME / PROD_DB_PASSWORD: credenciais do usuario MySQL
#     criado na ec2-private-banco-dados - as mesmas usadas pelo
#     triaige-srv-orchestrator (perfil prod) em "Deploy Apps".
#
# State remoto: como o backend continua local (terraform.tfstate não está
# versionado), o state é guardado entre execuções usando o cache do GitHub
# Actions (chave fixa "tfstate-cache"). Caches do Actions expiram após ~7
# dias sem uso — se isso acontecer, o próximo apply/destroy não terá o state
# anterior. Ver aviso equivalente no workflow de destroy.
#
name: Terraform Apply

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triaige-infra
        uses: actions/checkout@v6

      - name: Configurar credenciais AWS (Academy/Learner Lab)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.7.5"

      - name: Restaurar state remoto (cache)
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfstate
          key: tfstate-cache

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve

      - name: Exportar outputs do Terraform
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output -json > tfout.json

      - name: Publicar outputs do Terraform (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tfout
          path: ${{ env.TF_WORKING_DIR }}/tfout.json
          retention-days: 1

      - name: Remover cache antigo do state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete tfstate-cache --repo ${{ github.repository }} || true

      - name: Verificar se terraform.tfstate existe
        id: tfstate-check
        if: always()
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ -f terraform.tfstate ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::terraform.tfstate nao foi gerado (apply falhou antes de criar o state). Cache nao sera salvo."
          fi

      - name: Salvar state remoto (cache)
        if: always() && steps.tfstate-check.outputs.exists == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.TF_WORKING_DIR }}/terraform.tfstate
          key: tfstate-cache

  configure-mysql:
    name: Configurar MySQL (EC2 privada)
    needs: apply
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triaige-infra
        uses: actions/checkout@v6

      - name: Baixar outputs do Terraform
        uses: actions/download-artifact@v4
        with:
          name: tfout
          path: ${{ env.TF_WORKING_DIR }}

      - name: Gerar inventario e ssh_config do Ansible (EC2 privada, via proxy)
        run: |
          set -euo pipefail
          TFOUT="${{ env.TF_WORKING_DIR }}/tfout.json"

          public_ip_a="$(jq -r '.ec2_public_ips.value[0]' "$TFOUT")"
          private_ip="$(jq -r '.ec2_private_ip.value' "$TFOUT")"

          cat > ansible/ssh_config_private <<EOF
          Host jump-host
              HostName ${public_ip_a}
              User ubuntu
              IdentityFile id_ec2_public.pem
              IdentitiesOnly yes
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null

          Host ${private_ip}
              User ubuntu
              IdentityFile id_ec2_private.pem
              IdentitiesOnly yes
              ProxyJump jump-host
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
          EOF

          {
            echo "[triaige_private]"
            echo "${private_ip} ansible_ssh_common_args='-F ssh_config_private'"
          } > ansible/inventory.ini

      - name: Configurar chaves SSH para o Ansible (host privado + proxy)
        working-directory: ansible
        run: |
          echo "${{ secrets.EC2_PUBLIC_SSH_KEY }}" > id_ec2_public.pem
          echo "${{ secrets.EC2_PRIVATE_SSH_KEY }}" > id_ec2_private.pem
          chmod 600 id_ec2_public.pem id_ec2_private.pem

      - name: Instalar Ansible
        run: pip install --user ansible

      - name: Gerar variaveis do Ansible (credenciais do banco)
        working-directory: ansible
        run: |
          set -euo pipefail
          jq -n \
            --arg db_user "${{ secrets.PROD_DB_USERNAME }}" \
            --arg db_password "${{ secrets.PROD_DB_PASSWORD }}" \
            '{ db_user: $db_user, db_password: $db_password }' > vars.json

      - name: Configurar MySQL na ec2-private-banco-dados (Ansible)
        working-directory: ansible
        run: |
          ansible-playbook -i inventory.ini --extra-vars "@vars.json" playbook-configure-mysql.yml

      - name: Limpar credenciais temporarias do Ansible
        if: always()
        working-directory: ansible
        run: rm -f id_ec2_public.pem id_ec2_private.pem inventory.ini ssh_config_private vars.json
