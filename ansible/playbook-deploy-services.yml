# Playbook de deploy dos servicos TriAIge (perfil prod) nas EC2 publicas.
#
# Sobe, em cada EC2 publica (ec2-public-triaige-us-east-1a e -1b):
#   - triaige-srv-mcp-ai          (porta 8082)
#   - triaige-srv-orchestrator (porta 8080)
#
# triaige-srv-notification (porta 8083) esta desativado por enquanto - nem o
# repo do servico nem triaige-srv-notification-config existem ainda. As
# tasks correspondentes estao comentadas mais abaixo.
#
# As imagens sao construidas localmente em cada instancia a partir do
# Dockerfile de cada repositorio (git clone + docker build), sem depender de
# nenhum registry (ECR ou outro).
#
# Config de producao: nenhum dos dois servicos ativos depende mais de repos
# *-config separados (triaige-srv-mcp-ai-config e triaige-srv-orchestrator-config
# foram descontinuados). O srv-mcp-ai recebe tudo (porta, banco, chave Gemini)
# direto via env var no container; o srv-orchestrator tem seu
# application-prod.yml renderizado a partir do template local
# ansible/templates/triaige-srv-orchestrator/application-prod.yml.j2. Os dois
# servicos compartilham o mesmo banco/schema "triaige" (ver
# playbook-configure-mysql.yml e ansible/files/triaige-schema-seed.sql).
#
# Variaveis esperadas (via --extra-vars, geradas no workflow a partir dos
# outputs do Terraform e de Secrets do GitHub):
#   app_git_ref                  - branch/tag/commit dos repos de app a
#                                   deployar (default: main)
#   db_host                      - IP privado da ec2-private-banco-dados
#   db_username / db_password    - credenciais do MySQL (perfil prod), usadas
#                                   por triaige-srv-orchestrator e triaige-srv-mcp-ai
#                                   (banco unico "triaige")
#   aws_region                   - regiao AWS (us-east-1)
#   docs_received_queue_url
#   docs_preprocessing_queue_url  - consumida por triaige-srv-mcp-ai
#   results_ready_queue_url
#   raw_documents_bucket          - usado por triaige-srv-mcp-ai
#   trusted_documents_bucket      - usado por triaige-srv-mcp-ai
#   curated_results_bucket
#   ai_service_base_url          - URL do srv-ai a partir do srv-orchestrator
#   gemini_api_key                - chave Gemini de producao
#
# github_token e ses_sender_email nao sao mais passados por padrao (so tinham
# consumidor no bloco desativado de triaige-srv-notification).
#
# Rolling deploy: o play principal roda com serial: 1, ou seja, atualiza uma
# EC2 publica por vez (aguardando health check antes de seguir pra proxima),
# ja que o ALB agora roteia cada servico pras duas EC2 (ver triaige-infra
# terraform/modules/load_balancer/alb.tf).

- name: Aguardar SSH disponivel nas EC2 publicas
  hosts: triaige_public
  gather_facts: false
  tasks:
    - name: Esperar conexao SSH
      ansible.builtin.wait_for_connection:
        timeout: 300
        delay: 5

- name: Subir triaige-srv-mcp-ai e triaige-srv-orchestrator
  hosts: triaige_public
  become: true
  serial: 1
  vars:
    apps_dir: /opt/triaige
    config_dir: /etc/triaige
    github_org: TriAIge
    app_git_ref: "{{ app_git_ref | default('main') }}"

  tasks:
    - name: Atualizar cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar dependencias basicas (git, curl)
      ansible.builtin.apt:
        name:
          - git
          - ca-certificates
          - curl
        state: present

    - name: Instalar Docker (script oficial get.docker.com)
      ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
      args:
        creates: /usr/bin/docker

    - name: Garantir que o servico Docker esta ativo
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Criar diretorios de apps e config
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ apps_dir }}"
        - "{{ config_dir }}/triaige-srv-orchestrator-config"

    # ── triaige-srv-mcp-ai ──────────────────────────────────────────────────────
    - name: Clonar/atualizar triaige-srv-mcp-ai
      ansible.builtin.git:
        repo: "https://github.com/{{ github_org }}/triaige-srv-mcp-ai.git"
        dest: "{{ apps_dir }}/triaige-srv-mcp-ai"
        version: "{{ app_git_ref }}"
        force: true

    - name: Build da imagem triaige-srv-mcp-ai
      ansible.builtin.command: docker build -t triaige-srv-mcp-ai:latest .
      args:
        chdir: "{{ apps_dir }}/triaige-srv-mcp-ai"

    - name: Remover container anterior triaige-srv-mcp-ai
      ansible.builtin.command: docker rm -f triaige-srv-mcp-ai
      register: rm_srv_ai
      failed_when: false
      changed_when: rm_srv_ai.rc == 0

    - name: Subir container triaige-srv-mcp-ai
      ansible.builtin.command: >
        docker run -d --name triaige-srv-mcp-ai
        --restart unless-stopped
        --network host
        -e SPRING_PROFILES_ACTIVE=prod
        -e SERVER_PORT=8082
        -e DB_URL=jdbc:mysql://{{ db_host }}:3306/triaige?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
        -e DB_USERNAME={{ db_username }}
        -e DB_PASSWORD={{ db_password }}
        -e AWS_REGION={{ aws_region }}
        -e DOCS_PREPROCESSING_QUEUE_URL={{ docs_preprocessing_queue_url }}
        -e RAW_DOCUMENTS_BUCKET={{ raw_documents_bucket }}
        -e TRUSTED_DOCUMENTS_BUCKET={{ trusted_documents_bucket }}
        -e GEMINI_API_KEY={{ gemini_api_key }}
        triaige-srv-mcp-ai:latest
      no_log: true

    - name: Aguardar triaige-srv-mcp-ai ficar saudavel
      ansible.builtin.uri:
        url: http://localhost:8082/actuator/health
        status_code: 200
      register: health_srv_ai
      until: health_srv_ai.status == 200
      retries: 10
      delay: 5

    # ── triaige-srv-orchestrator ────────────────────────────────────────────
    - name: Clonar/atualizar triaige-srv-orchestrator
      ansible.builtin.git:
        repo: "https://github.com/{{ github_org }}/triaige-srv-orchestrator.git"
        dest: "{{ apps_dir }}/triaige-srv-orchestrator"
        version: "{{ app_git_ref }}"
        force: true

    - name: Renderizar application-prod.yml (srv-orchestrator) a partir do template local
      ansible.builtin.template:
        src: templates/triaige-srv-orchestrator/application-prod.yml.j2
        dest: "{{ config_dir }}/triaige-srv-orchestrator-config/application-prod.yml"
        mode: "0644"
      no_log: true

    - name: Build da imagem triaige-srv-orchestrator
      ansible.builtin.command: docker build -t triaige-srv-orchestrator:latest .
      args:
        chdir: "{{ apps_dir }}/triaige-srv-orchestrator"

    - name: Remover container anterior triaige-srv-orchestrator
      ansible.builtin.command: docker rm -f triaige-srv-orchestrator
      register: rm_srv_orchestrator
      failed_when: false
      changed_when: rm_srv_orchestrator.rc == 0

    - name: Subir container triaige-srv-orchestrator
      ansible.builtin.command: >
        docker run -d --name triaige-srv-orchestrator
        --restart unless-stopped
        --network host
        -e SPRING_PROFILES_ACTIVE=prod
        -e CONFIG_REPO_PATH=/config/
        -v {{ config_dir }}/triaige-srv-orchestrator-config:/config:ro
        triaige-srv-orchestrator:latest

    - name: Aguardar triaige-srv-orchestrator ficar saudavel
      ansible.builtin.uri:
        url: http://localhost:8080/actuator/health
        status_code: 200
      register: health_srv_orchestrator
      until: health_srv_orchestrator.status == 200
      retries: 10
      delay: 5

