# Playbook de configuracao do MySQL na ec2-private-banco-dados.
#
# Instala o MySQL Server, libera conexoes externas (bind-address 0.0.0.0,
# liberado apenas para o sg-app-triaige via security group), cria o banco
# unico "triaige" (compartilhado por triaige-srv-orchestrator e
# triaige-srv-notification) e usuario triaige, e aplica o schema + seed de
# conveniencia (ansible/files/triaige-schema-seed.sql) uma unica vez.
#
# Alcance: a EC2 privada nao tem IP publico, entao o host e acessado via
# ProxyJump por uma das EC2 publicas (ver inventory.ini gerado pelo
# workflow, grupo triaige_private).

- name: Configurar MySQL na ec2-private-banco-dados
  hosts: triaige_private
  become: true
  vars:
    db_names:
      - triaige
    db_user: triaige
    db_password: triaige
    seed_marker: /etc/triaige/.mysql_seed_applied

  tasks:
    - name: Atualizar cache apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Instalar MySQL Server
      ansible.builtin.apt:
        name: mysql-server
        state: present

    - name: Garantir que o servico MySQL esta ativo
      ansible.builtin.systemd:
        name: mysql
        state: started
        enabled: true

    - name: Detectar arquivo de configuracao do MySQL
      ansible.builtin.stat:
        path: /etc/mysql/mysql.conf.d/mysqld.cnf
      register: mysqld_cnf

    - name: Permitir conexoes externas (bind-address 0.0.0.0)
      ansible.builtin.replace:
        path: "{{ mysqld_cnf.stat.exists | ternary('/etc/mysql/mysql.conf.d/mysqld.cnf', '/etc/mysql/my.cnf') }}"
        regexp: '^bind-address\s*=.*'
        replace: 'bind-address = 0.0.0.0'
      register: mysql_bind_address

    - name: Reiniciar MySQL apos alterar bind-address
      ansible.builtin.systemd:
        name: mysql
        state: restarted
      when: mysql_bind_address.changed

    - name: Criar databases
      ansible.builtin.command: >
        mysql -e "CREATE DATABASE IF NOT EXISTS {{ item }};"
      loop: "{{ db_names }}"
      changed_when: false

    - name: Criar usuario com acesso remoto
      ansible.builtin.command: >
        mysql -e "CREATE USER IF NOT EXISTS '{{ db_user }}'@'%' IDENTIFIED WITH mysql_native_password BY '{{ db_password }}';"
      changed_when: false
      no_log: true

    # CREATE USER IF NOT EXISTS e no-op se o usuario ja existe - nao atualiza
    # a senha. Sem este ALTER, reexecutar o playbook com um PROD_DB_PASSWORD
    # diferente do que criou o usuario da primeira vez nao teria efeito, e o
    # app continuaria autenticando com a senha antiga.
    - name: Sincronizar senha do usuario MySQL
      ansible.builtin.command: >
        mysql -e "ALTER USER '{{ db_user }}'@'%' IDENTIFIED WITH mysql_native_password BY '{{ db_password }}';"
      changed_when: false
      no_log: true

    - name: Conceder privilegios do usuario nos databases
      ansible.builtin.command: >
        mysql -e "GRANT ALL PRIVILEGES ON {{ item }}.* TO '{{ db_user }}'@'%'; FLUSH PRIVILEGES;"
      loop: "{{ db_names }}"
      changed_when: false

    - name: Criar diretorio de config/estado do Triaige
      ansible.builtin.file:
        path: /etc/triaige
        state: directory
        mode: "0755"

    - name: Copiar schema + seed de conveniencia
      ansible.builtin.copy:
        src: triaige-schema-seed.sql
        dest: /tmp/triaige-schema-seed.sql
        mode: "0644"

    # Roda uma unica vez: o script tem CREATE TABLE (sem IF NOT EXISTS) e
    # INSERT com IDs fixos, entao nao e idempotente por si so. O marker em
    # seed_marker garante que reexecucoes do playbook (ex: outro deploy)
    # pulem esta task.
    - name: Aplicar schema + seed (uma unica vez)
      ansible.builtin.shell: >
        mysql < /tmp/triaige-schema-seed.sql && touch {{ seed_marker }}
      args:
        creates: "{{ seed_marker }}"
